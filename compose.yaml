services:
  kafka:
    profiles: ["kafka"]
    image: apache/kafka:4.4.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    cpus: 8
    mem_limit: 4g
    memswap_limit: 4g

  tei:
    profiles: ["embeddings"]
    image: ghcr.io/huggingface/text-embeddings-inference:cuda-1.9
    command:
      - --model-id
      - ${OSIRIS_TEI_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - --max-client-batch-size
      - ${OSIRIS_TEI_MAX_CLIENT_BATCH_SIZE:-128}
      - --max-batch-tokens
      - ${OSIRIS_TEI_MAX_BATCH_TOKENS:-8192}
      - --tokenization-workers
      - ${OSIRIS_TEI_TOKENIZATION_WORKERS:-4}
    ports:
      - "8080:80"
    volumes:
      - ./cache/tei:/data
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    cpus: 4
    mem_limit: 4g
    memswap_limit: 4g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  qdrant_storage:
